apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: your-dockerhub-username/auth-service:latest
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: jwt-secret
        - secretRef:
            name: db-secret
        env:
        - name: PORT
          value: "4000"
        - name: NODE_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth
  ports:
  - port: 4000
    targetPort: 4000
