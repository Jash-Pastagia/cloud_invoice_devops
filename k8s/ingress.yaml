apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invoice-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: cloudinvoice.local
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 4000
      - path: /invoice
        pathType: Prefix
        backend:
          service:
            name: invoice-service
            port:
              number: 5000
      - path: /payment
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 6000
