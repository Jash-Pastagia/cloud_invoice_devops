apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: default
  labels:
    app: database
    component: initialization
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: database
        component: initialization
    spec:
      restartPolicy: Never
      containers:
      - name: db-init
        image: postgres:16-alpine
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "🔄 Starting database initialization..."
          
          # Wait for PostgreSQL to be ready
          until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; do
            echo "⏳ Waiting for PostgreSQL to be ready..."
            sleep 2
          done
          
          echo "✅ PostgreSQL is ready"
          
          # Run migrations
          echo "🚀 Running database migrations..."
          for sql_file in /migrations/*.sql; do
            if [ -f "$sql_file" ]; then
              echo "📄 Executing $(basename $sql_file)..."
              PGPASSWORD="$DB_PASSWORD" psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -f "$sql_file"
              echo "✅ Completed $(basename $sql_file)"
            fi
          done
          
          echo "🎉 Database initialization completed successfully!"
        env:
        - name: DB_HOST
          value: "postgresql"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_NAME
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: migrations
        configMap:
          name: db-migrations