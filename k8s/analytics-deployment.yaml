# k8s/analytics-deployment.yaml
# Kubernetes deployment and service for analytics-service
# Use imagePullPolicy: Never for Minikube/local development

apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels:
    app: analytics-service
    component: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        component: analytics
    spec:
      containers:
      - name: analytics-service
        image: techs129/innovative-ci-analytics-service:latest
        ports:
        - containerPort: 7100
          name: http
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: PORT
          value: "7100"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_HOST
        - name: KAFKA_CONSUMER_GROUP
          value: "analytics-service-group-v2"
        - name: TOPICS
          value: "invoice.created,invoice.paid,payment.processed,payment.initiated"
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 7100
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 7100
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Resource limits
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  labels:
    app: analytics-service
    component: analytics
spec:
  type: ClusterIP
  ports:
  - port: 7100
    targetPort: 7100
    protocol: TCP
    name: http
  selector:
    app: analytics-service

---
# Optional: NodePort service for external access during development
apiVersion: v1
kind: Service
metadata:
  name: analytics-service-nodeport
  labels:
    app: analytics-service
    component: analytics
spec:
  type: NodePort
  ports:
  - port: 7100
    targetPort: 7100
    nodePort: 30710
    protocol: TCP
    name: http
  selector:
    app: analytics-service