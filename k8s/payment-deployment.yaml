apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: your-dockerhub-username/payment-service:latest
        ports:
        - containerPort: 6060  # Changed to browser-safe port
        envFrom:
        - secretRef:
            name: jwt-secret
        env:
        - name: PORT
          value: "6060"
        - name: NODE_ENV
          value: "production"
        - name: INVOICE_URL
          value: "http://invoice-service:5050"
        - name: KAFKA_BROKERS
          value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment
  ports:
  - port: 6060
    targetPort: 6060
