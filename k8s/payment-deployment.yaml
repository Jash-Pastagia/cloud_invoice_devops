apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: your-dockerhub-username/payment-service:latest
        ports:
        - containerPort: 6000
        envFrom:
        - secretRef:
            name: jwt-secret
        env:
        - name: INVOICE_URL
          value: "http://invoice-service:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment
  ports:
  - port: 6000
    targetPort: 6000
