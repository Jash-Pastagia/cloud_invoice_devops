# Replace image with your DockerHub username or use imagePullPolicy: Never for Minikube/local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - name: notification
        image: your-dockerhub-username/notification-service:latest
        ports:
        - containerPort: 7000
        env:
        - name: PORT
          value: "7000"
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: KAFKA_CONSUMER_GROUP
          value: "notification-service-group"
        - name: TOPICS
          value: "invoice.created,invoice.paid,payment.processed"
        livenessProbe:
          httpGet:
            path: /notifications
            port: 7000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /notifications
            port: 7000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification
  ports:
  - name: http
    port: 7000
    targetPort: 7000