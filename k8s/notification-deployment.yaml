# Replace image with your DockerHub username or use imagePullPolicy: Never for Minikube/local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - name: notification
        image: techs129/innovative-ci-notification-service:latest
        ports:
        - containerPort: 7200
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: PORT
          value: "7200"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_HOST
        - name: KAFKA_CONSUMER_GROUP
          value: "notification-service-group-v3"
        - name: TOPICS
          value: "invoice.created,invoice.paid,payment.processed,payment.initiated"
        livenessProbe:
          httpGet:
            path: /
            port: 7200
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 7200
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification
  ports:
  - name: http
    port: 7200
    targetPort: 7200