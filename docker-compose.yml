services:
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      - JWT_SECRET=supersecretdevops
      - PORT=4000
    ports:
      - "4000:4000"
    networks:
      - devnet

  invoice-service:
    build: ./invoice-service
    container_name: invoice-service
    environment:
      - JWT_SECRET=supersecretdevops
      - PORT=5000
    ports:
      - "5000:5000"
    networks:
      - devnet
    depends_on:
      - auth-service

  payment-service:
    build: ./payment-service
    container_name: payment-service
    environment:
      - JWT_SECRET=supersecretdevops
      - INVOICE_URL=http://invoice-service:5000
      - PORT=6000
    ports:
      - "6000:6000"
    networks:
      - devnet
    depends_on:
      - invoice-service
      - auth-service

networks:
  devnet:
    driver: bridge
