name: Terraform - Infrastructure as Code

# Automates Terraform planning and deployment
# - PR: terraform plan (preview changes)
# - Merge to main: terraform apply (deploy infrastructure)

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write
  id-token: write  # For OIDC authentication with AWS

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'
  ENVIRONMENT: 'dev'

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Comment Format Check Results
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: '⚠️ **Terraform Format Check Failed**\n\nPlease run `terraform fmt -recursive` to format your code.'
            })

  terraform-plan:
    name: Terraform Plan
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Option 1: Use OIDC (recommended for security)
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Option 2: Use access keys (fallback)
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region    = "${{ env.AWS_REGION }}"
          environment   = "${{ env.ENVIRONMENT }}"
          project_name  = "cloud-invoice"
          
          # Database credentials (use secrets in production!)
          db_password   = "${{ secrets.DB_PASSWORD || 'ChangeMeInProduction!' }}"
          jwt_secret    = "${{ secrets.JWT_SECRET || 'supersecretdevops' }}"
          
          # Network configuration
          vpc_cidr               = "10.0.0.0/16"
          availability_zones     = ["us-east-1a", "us-east-1b", "us-east-1c"]
          
          # EKS configuration
          eks_cluster_version           = "1.28"
          eks_node_group_desired_size   = 2
          eks_node_group_min_size       = 1
          eks_node_group_max_size       = 4
          eks_node_group_instance_types = ["t3.medium"]
          
          # RDS configuration  
          rds_instance_class         = "db.t3.micro"
          rds_allocated_storage      = 20
          rds_engine_version         = "16.1"
          rds_multi_az               = false
          
          # MSK configuration
          msk_number_of_broker_nodes = 3
          msk_broker_instance_type   = "kafka.t3.small"
          msk_broker_storage_size    = 100
          
          # Cost optimization
          enable_nat_gateway     = true
          single_nat_gateway     = true
          EOF

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Save Plan Output
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/plan.txt
          retention-days: 30

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const truncatedPlan = plan.length > 60000 ? plan.substring(0, 60000) + '\n\n... (plan truncated)' : plan;
            
            const output = `#### Terraform Plan 📝
            
            <details>
            <summary>Show Plan</summary>
            
            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: output
            })

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Terraform Apply
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.inputs.action == 'apply'
    environment: 
      name: production
      url: https://console.aws.amazon.com/eks
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region    = "${{ env.AWS_REGION }}"
          environment   = "${{ env.ENVIRONMENT }}"
          project_name  = "cloud-invoice"
          
          db_password   = "${{ secrets.DB_PASSWORD }}"
          jwt_secret    = "${{ secrets.JWT_SECRET }}"
          
          vpc_cidr               = "10.0.0.0/16"
          availability_zones     = ["us-east-1a", "us-east-1b", "us-east-1c"]
          
          eks_cluster_version           = "1.28"
          eks_node_group_desired_size   = 2
          eks_node_group_min_size       = 1
          eks_node_group_max_size       = 4
          eks_node_group_instance_types = ["t3.medium"]
          
          rds_instance_class         = "db.t3.micro"
          rds_allocated_storage      = 20
          rds_multi_az               = false
          
          msk_number_of_broker_nodes = 3
          msk_broker_instance_type   = "kafka.t3.small"
          
          enable_nat_gateway     = true
          single_nat_gateway     = true
          EOF

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Save Terraform Outputs
        id: outputs
        run: |
          terraform output -json > outputs.json
          echo "EKS_CLUSTER=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "RDS_ENDPOINT=$(terraform output -raw rds_endpoint_address)" >> $GITHUB_OUTPUT

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform/outputs.json

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ steps.outputs.outputs.EKS_CLUSTER }}

      - name: Deployment Summary
        run: |
          echo "## 🚀 Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| EKS Cluster | \`${{ steps.outputs.outputs.EKS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Endpoint | \`${{ steps.outputs.outputs.RDS_ENDPOINT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure kubectl: \`aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ steps.outputs.outputs.EKS_CLUSTER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy applications to EKS cluster" >> $GITHUB_STEP_SUMMARY
          echo "3. Update application configurations with new endpoints" >> $GITHUB_STEP_SUMMARY

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    environment:
      name: production-destroy
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve

      - name: Destruction Summary
        run: |
          echo "## 🗑️ Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All resources have been destroyed." >> $GITHUB_STEP_SUMMARY
